# Default = saved data (NOT freshly Wiki/RuneLite checked). No blocked mirror requests in that mode.
# Automatically recovers a matching APK from previous artifacts in this repository.
# If none is available, upload the supplied saved-data APK to the repository root.
# Uncheck use_packaged_snapshot only when you want fresh source checks, which may stop on source access blocks.
# Compressed scripts keep this single workflow below GitHub's documented size limits.
name: QuestMate v83 - Saved data default with optional fresh source checks
'on':
  workflow_dispatch:
    inputs:
      use_packaged_snapshot:
        description: Use saved APK data (NOT freshly Wiki/RuneLite checked) to avoid blocked source downloads
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QM_USE_SNAPSHOT: ${{ inputs.use_packaged_snapshot && 'true' || 'false' }}
      QM_DATA_LABEL: ${{ inputs.use_packaged_snapshot && 'SNAPSHOT' || 'SOURCE-CHECKED' }}
      QM_PLAN_B64_000: 
      QM_PLAN_B64_001: 
      QM_PLAN_B64_002: 
      QM_PLAN_B64_003: 
      QM_PLAN_B64_004: 
      QM_PLAN_B64_005: 
      QM_PLAN_B64_006: 
      QM_PLAN_B64_007: 
      QM_PLAN_B64_008: 
      QM_PLAN_B64_009: 
      QM_PLAN_B64_010: 
      QM_PLAN_B64_011: 
      QM_PLAN_B64_012: 
      QM_PLAN_B64_013: 
      QM_PLAN_B64_014: 
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
    - name: Restore compact build scripts
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''RESTORE_PLAN''

        import base64,hashlib,json,lzma,os

        from pathlib import Path

        parts=[os.environ[k] for k in sorted(os.environ) if k.startswith(''QM_PLAN_B64_'')]

        packed=base64.b64decode(''''.join(parts),validate=True)

        assert hashlib.sha256(packed).hexdigest()==''f76e04858e1991156d5aaf87bef8c2a1bb9be97934823819789ee7ea73d81520'', ''Damaged build script payload''

        raw=lzma.decompress(packed)

        assert len(json.loads(raw)[''stages''])==28, ''Incomplete build plan''

        temp=Path(os.environ[''RUNNER_TEMP''])

        (temp/''qm-v83-build-plan.json'').write_bytes(raw)

        (temp/''qm-v83-run-stage.py'').write_text("import json,os,subprocess,sys\nfrom pathlib import Path\nplan=json.loads(Path(__file__).with_name(''qm-v83-build-plan.json'').read_text(encoding=''utf-8''))\nstage=plan[''stages''][int(sys.argv[1])]\nroot=Path(os.environ[''GITHUB_WORKSPACE'']).resolve()\ncwd=(root/stage[''workingDirectory'']).resolve()\nif not cwd.is_relative_to(root):\n    raise SystemExit(''Stage working directory escaped the repository'')\nchild_env={k:v for k,v in os.environ.items() if not k.startswith(''QM_PLAN_B64_'')}\nprint(stage[''name''],flush=True)\nresult=subprocess.run([''bash'',''--noprofile'',''--norc'',''-eo'',''pipefail''],input=stage[''run''],\n                      cwd=cwd,env=child_env,text=True)\nraise SystemExit(result.returncode)\n",encoding=''utf-8'')

        print(''Restored build scripts. Default = labelled saved data, not a fresh source audit. Optional live checks may stop on source access blocks.'')

        RESTORE_PLAN

        '
    - name: Install guide builder dependencies
      if: ${{ !inputs.use_packaged_snapshot }}
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 0
    - name: CONFIRM V83 - TABBED QUESTS + CLUE HELPER + GE CHECKER
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 1
    - name: CREATE QM v83 - QUEST + CLUE + GE APP
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 2
    - name: Recover saved quest data from the previous APK artifact
      if: ${{ inputs.use_packaged_snapshot }}
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 3
    - name: CREATE QM v83 FROM EXPLICIT PACKAGED SNAPSHOT
      if: ${{ inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 4
    - name: Robust full-guide recovery and validation for every quest
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 5
    - name: Reconcile final metadata with authoritative source evidence
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 6
    - name: Build OSRS clue-scroll solution database
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 7
    - name: Build verified GE item link index for osrs.exchange
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 8
    - name: Validate v83 clue helper data and Misthalin patch
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 9
    - name: FULL v83 authoritative cross-reference gate
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 10
    - name: Verify guide database has no wiki links or placeholder text
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 11
    - name: Semantic source-consistency audit for EVERY quest
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 12
    - name: Targeted semantic regression checks for historically problematic quests
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 13
    - name: Cross-check requirements against RuneLite Quest Helper
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 14
    - name: Full per-quest accuracy and completeness audit
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 15
    - name: Validate Quest Cape route uses the same verified quest requirements
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 16
    - name: Validate v83 quest layout data
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 17
    - name: Validate mirror-derived quest data and Imp Catcher
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 18
    - name: Validate Recipe for Disaster is one complete main quest
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 19
    - name: Validate exact main quest population
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 20
    - name: Validate Death Plateau and all repaired walkthroughs
      if: ${{ !inputs.use_packaged_snapshot }}
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 21
    - name: Separate F2P training and label route verification limits
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 22
    - name: Validate data mode, snapshot hashes and route structure
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 23
    - name: Build debug APK
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 24
    - name: Verify APK exists
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 25
    - name: Verify v83 UI and reward-colour logic
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 26
    - name: Upload QM v83 - QUEST + CLUE + GE APK
      uses: actions/upload-artifact@v4
      with:
        name: QuestMate-v83-${{ env.QM_DATA_LABEL }}
        path: questmate-complete/app/build/outputs/apk/debug/INSTALL-THIS-QM-v83-${{ env.QM_DATA_LABEL }}.apk
        if-no-files-found: error
    - name: Upload data-mode and integrity reports
      uses: actions/upload-artifact@v4
      with:
        name: QuestMate-v83-${{ env.QM_DATA_LABEL }}-Reports
        if-no-files-found: error
        path: 'questmate-complete/data-mode-report.json

          questmate-complete/offline-integrity-report.json

          questmate-complete/snapshot-integrity-report.json

          questmate-complete/f2p-training-report.txt

          questmate-complete/guide-audit.csv

          questmate-complete/guide-build-report.txt

          questmate-complete/runelite-requirements-crosscheck.txt

          questmate-complete/full-quest-audit.txt

          questmate-complete/semantic-reference.json

          questmate-complete/v83-source-reconciliation.txt

          questmate-complete/all-quest-semantic-audit.txt

          questmate-complete/quest-cape-semantic-audit.txt

          questmate-complete/v70-guide-repair.txt

          questmate-complete/v83-unresolved-guides.txt

          questmate-complete/v83-metadata-leaks.txt

          questmate-complete/v30-guide-repair.txt

          questmate-complete/cape-route-report.txt

          questmate-complete/runelite-requirements-crosscheck.txt

          questmate-complete/fresh-account-route-report.txt

          questmate-complete/clue-helper-audit.txt

          questmate-complete/ge-price-checker-audit.txt

          questmate-complete/seed-integrity.txt

          questmate-complete/v83-full-source-crosscheck.txt

          questmate-complete/full-quest-audit.txt

          '
        retention-days: 30
    - name: Write clear Actions summary
      shell: bash
      run: python3 "$RUNNER_TEMP/qm-v83-run-stage.py" 27
